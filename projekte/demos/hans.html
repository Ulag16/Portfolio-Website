<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hans der Panda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
/* Vollbild-Diorama: schwebende Bambusinsel, Titel oben, Sprechblase folgt dem Kopf */
:root {
  --sky-top: #bfe3f2;
  --sky-bottom: #f6efd9;
  --ink: #1f2b22;
  --muted: #4f6553;
  --bubble: #ffffff;
  --accent: #5f9a3c;
  --sun: 1.15;
  --display: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0e1a2b; --sky-bottom: #2a3550; --ink: #eef3ea; --muted: #a9bba9;
    --bubble: #2b3a33; --accent: #8cc56a; --sun: 0.6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0e1a2b; --sky-bottom: #2a3550; --ink: #eef3ea; --muted: #a9bba9;
  --bubble: #2b3a33; --accent: #8cc56a; --sun: 0.6; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
  background-color: var(--sky-bottom);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
}
main { position: relative; height: 100%; }
#scene { position: absolute; inset: 0; outline: none; }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
#scene:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }
header {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding-block: 22px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
  pointer-events: none;
  z-index: 2;
}
h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(2rem, 6vw, 3.2rem);
  line-height: 1;
  margin: 0;
  text-wrap: balance;
}
.hint { margin: 6px 0 0; color: var(--muted); font-size: 1rem; }
.bubble {
  position: absolute;
  left: 0; top: 0;
  z-index: 3;
  max-width: min(320px, calc(100vw - 32px));
  box-sizing: border-box;
  background: var(--bubble);
  color: var(--ink);
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.2rem;
  line-height: 1.3;
  text-align: center;
  padding: 12px 18px;
  border-radius: 22px;
  box-shadow: 0 10px 30px rgb(0 0 0 / .15);
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%) scale(.6);
  transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1);
}
.bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
.bubble::after {
  content: "";
  position: absolute;
  left: var(--tail, 50%);
  bottom: -12px;
  transform: translateX(-50%);
  border: 12px solid transparent;
  border-bottom: 0;
  border-top-color: var(--bubble);
}
.counter {
  position: absolute;
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  text-align: center;
  font-family: var(--display);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  margin: 0;
  z-index: 2;
}
.heart {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  font-size: 1.6rem;
  animation: float 1.2s ease-out forwards;
}
@keyframes float {
  from { opacity: 1; transform: translate(-50%, -50%) scale(.5); }
  to { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% - 120px)) scale(1.2) rotate(var(--rot)); }
}
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--display); }
@media (prefers-reduced-motion: reduce) {
  .heart { animation-duration: .01ms; }
}
</style>

<main>
  <div id="scene" tabindex="0" role="button" aria-label="Panda anklicken">
    <div class="loading" id="loading">Panda wird geweckt …</div>
  </div>
  <header>
    <h1>Hans der Panda</h1>
    <p class="hint">Klick auf den Panda!</p>
  </header>
  <div class="bubble" id="bubble" aria-live="polite"></div>
  <p class="counter" id="counter">0 Mal gestreichelt</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const container = document.getElementById("scene");
const bubble = document.getElementById("bubble");
const counter = document.getElementById("counter");
document.getElementById("loading").remove();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

THREE.ColorManagement.legacyMode = false;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const lookTarget = new THREE.Vector3(0, 2.1, 0);

const hemi = new THREE.HemisphereLight(0xfff4dc, 0x6b8f4e, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.2);
sun.position.set(4, 9, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 7, bottom: -3, near: 1, far: 30 });
sun.shadow.radius = 4;
sun.shadow.bias = -0.0005;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfe0ff, 0.5);
rim.position.set(-5, 4, -6);
scene.add(rim);

const mat = (color, rough = 0.8, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, ...extra });
const M = {
  fur: mat(0xf7f4ec, 0.9),
  black: mat(0x232227, 0.75),
  pad: mat(0x4a3f46, 0.6),
  eye: mat(0x111114, 0.2),
  shine: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  white: mat(0xffffff, 0.3),
  mouth: mat(0x7a2b35, 0.5),
  blush: mat(0xf4a3a8, 0.9, { transparent: true, opacity: 0.75 }),
  grass: mat(0x7fb85a, 1),
  dirt: mat(0x8a6a4a, 1),
  bamboo: mat(0x7fae4f, 0.55),
  bambooNode: mat(0x5d8a37, 0.6),
  leaf: mat(0x6cab43, 0.7, { side: THREE.DoubleSide }),
  stone: mat(0xb8b2a6, 0.9),
};

function ball(material, r = 1, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28), material);
  m.scale.set(sx, sy, sz);
  return m;
}
function at(obj, x, y, z) { obj.position.set(x, y, z); return obj; }

const panda = new THREE.Group();
scene.add(panda);
const root = new THREE.Group();
panda.add(root);

const torso = new THREE.Group();
root.add(torso);
const smooth = d => Math.min(1, Math.max(0, d / 0.06 + 0.5));
const bodyGeo = new THREE.SphereGeometry(1, 96, 64);
const bp = bodyGeo.attributes.position, bodyCols = [];
const cW = new THREE.Color(0xf7f4ec), cB = new THREE.Color(0x232227), cTmp = new THREE.Color();
for (let i = 0; i < bp.count; i++) {
  const x = bp.getX(i), y = bp.getY(i), z = bp.getZ(i);
  let k = Math.min(smooth(y - (0.02 + 0.1 * z)), smooth(0.8 - 0.2 * Math.max(0, z) - y));
  const chest = smooth(z - 0.42) * smooth(0.5 - Math.abs(x) + 0.15 * (y - 0.3));
  k *= 1 - chest;
  cTmp.copy(cW).lerp(cB, k);
  bodyCols.push(cTmp.r, cTmp.g, cTmp.b);
}
bodyGeo.setAttribute("color", new THREE.Float32BufferAttribute(bodyCols, 3));
const bodyMesh = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 }));
bodyMesh.scale.set(1.05, 1.08, 0.95);
torso.add(at(bodyMesh, 0, 1.1, 0));
[-1, 1].forEach(s => torso.add(at(ball(M.black, 0.46, 1, 0.9, 1.1), s * 0.6, 0.45, 0.25)));
torso.add(at(ball(M.fur, 0.18), 0, 0.45, -0.92));

function makeLeg(side) {
  const g = new THREE.Group();
  const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.5, 8, 20), M.black);
  leg.rotation.x = Math.PI / 2;
  g.add(leg);
  g.add(at(ball(M.pad, 0.2, 1, 1.1, 0.25), 0, 0.02, 0.58));
  [-0.12, 0, 0.12].forEach(x => g.add(at(ball(M.pad, 0.06, 1, 1, 0.5), x, 0.22, 0.56)));
  g.position.set(side * 0.55, 0.36, 0.55);
  g.rotation.y = side * 0.25;
  return g;
}
const legL = makeLeg(-1), legR = makeLeg(1);
root.add(legL, legR);

function makeArm(side) {
  const pivot = new THREE.Group();
  pivot.position.set(side * 0.74, 1.8, 0.2);
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.5, 8, 24), M.black);
  arm.position.y = -0.42;
  pivot.add(arm);
  pivot.add(at(ball(M.black, 0.33, 1, 0.9, 1.05), 0, -0.86, 0.06));
  pivot.add(at(ball(M.pad, 0.15, 1, 0.75, 0.45), 0, -0.95, 0.26));
  [-0.12, 0, 0.12].forEach(x => pivot.add(at(ball(M.pad, 0.055, 1, 1, 0.6), x, -0.78, 0.36)));
  return pivot;
}
const armL = makeArm(-1), armR = makeArm(1);
root.add(armL, armR);

const head = new THREE.Group();
head.position.set(0, 2.47, 0.08);
root.add(head);
head.add(ball(M.fur, 0.85, 1.1, 0.95, 1));
[-1, 1].forEach(s => {
  head.add(at(ball(M.black, 0.27, 1, 1, 0.7), s * 0.62, 0.6, -0.05));
  head.add(at(ball(M.pad, 0.14, 1, 1, 0.4), s * 0.62, 0.6, 0.13));
});
const eyes = [];
[-1, 1].forEach(s => {
  const patch = at(ball(M.black, 1, 0.23, 0.31, 0.11), s * 0.31, 0.0, 0.73);
  patch.rotation.set(0, s * 0.38, s * 0.5);
  head.add(patch);
  const eye = new THREE.Group();
  eye.position.set(s * 0.29, 0.05, 0.83);
  eye.add(ball(M.white, 0.1));
  eye.add(at(ball(M.eye, 0.078), s * -0.012, -0.01, 0.04));
  eye.add(at(ball(M.shine, 0.028), s * -0.012 + 0.03, 0.03, 0.11));
  eye.add(at(ball(M.shine, 0.012), s * -0.012 - 0.025, -0.035, 0.115));
  head.add(eye);
  eyes.push(eye);
  const cheek = at(ball(M.blush, 1, 0.12, 0.07, 0.03), s * 0.5, -0.2, 0.67);
  cheek.rotation.y = s * 0.6;
  head.add(cheek);
});
head.add(at(ball(M.fur, 1, 0.34, 0.24, 0.22), 0, -0.22, 0.74));
head.add(at(ball(M.black, 1, 0.11, 0.075, 0.07), 0, -0.11, 0.95));
head.add(at(ball(M.shine, 0.02), 0.03, -0.085, 1.015));
const mouth = at(ball(M.mouth, 1, 0.07, 0.018, 0.04), 0, -0.33, 0.925);
head.add(mouth);

const GRIP = 0.25;
const held = new THREE.Group();
armL.add(held);
const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, 1, 16).translate(0, 0.5, 0), M.bamboo);
stalk.position.y = -GRIP;
held.add(stalk);
const stickBase = new THREE.Mesh(new THREE.CircleGeometry(0.085, 16), M.bambooNode);
stickBase.rotation.x = Math.PI / 2;
stickBase.position.y = -GRIP - 0.002;
held.add(stickBase);
const stickCut = new THREE.Group();
const cutFace = new THREE.Mesh(new THREE.CircleGeometry(0.074, 16), mat(0xf1e9b8, 0.8));
cutFace.rotation.x = -Math.PI / 2;
stickCut.add(cutFace);
const cutRim = new THREE.Mesh(new THREE.TorusGeometry(0.068, 0.012, 6, 16), mat(0xd9cf8a, 0.8));
cutRim.rotation.x = Math.PI / 2;
stickCut.add(cutRim);
held.add(stickCut);
const stickRings = [0.38, 0.78, 1.18].map(d => {
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.093, 0.093, 0.04, 16), M.bambooNode);
  held.add(r);
  return { r, d };
});
const tuft = new THREE.Group();
for (let k = 0; k < 5; k++) {
  const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.13, 0.55), M.leaf);
  leaf.position.y = 0.26;
  const h = new THREE.Group();
  h.rotation.set(0.55 + 0.1 * (k % 2), k * 1.26, 0);
  h.add(leaf);
  tuft.add(h);
}
const bud = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.2, 12), M.bambooNode);
bud.position.y = 0.1;
tuft.add(bud);
held.add(tuft);

panda.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

const island = new THREE.Group();
scene.add(island);
const grassTop = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.4, 0.35, 64), M.grass);
grassTop.position.y = -0.175;
grassTop.receiveShadow = true;
island.add(grassTop);
const under = new THREE.Mesh(new THREE.ConeGeometry(4.4, 2.6, 64, 1, true), M.dirt);
under.rotation.x = Math.PI;
under.position.y = -1.65;
island.add(under);

function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const rnd = rand(42);

function bambooStalk(x, z, h, lean) {
  const g = new THREE.Group();
  const seg = 0.7;
  const n = Math.round(h / seg);
  for (let i = 0; i < n; i++) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, seg - 0.04, 16), M.bamboo);
    c.position.y = i * seg + seg / 2;
    g.add(c);
    const node = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.06, 16), M.bambooNode);
    node.position.y = (i + 1) * seg - 0.02;
    g.add(node);
    if (i > 2 && rnd() > 0.45) {
      const twig = new THREE.Group();
      twig.position.y = (i + 1) * seg;
      twig.rotation.y = rnd() * Math.PI * 2;
      for (let k = 0; k < 4; k++) {
        const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.75), M.leaf);
        leaf.position.set(0.35, 0.05, 0);
        leaf.rotation.set(0.3, k * 0.5 - 0.7, -1.2 + k * 0.15);
        const holder = new THREE.Group();
        holder.rotation.y = k * 0.4;
        holder.add(leaf);
        twig.add(holder);
      }
      g.add(twig);
    }
  }
  g.position.set(x, 0, z);
  g.rotation.z = lean;
  g.rotation.x = -Math.abs(lean) * 0.3;
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}
const stalks = [
  [-3.1, -1.6, 5.6, 0.05], [-2.6, -2.4, 6.6, -0.03], [-3.6, -0.4, 4.2, 0.12],
  [2.9, -1.8, 6.2, -0.06], [3.5, -0.7, 4.6, -0.12], [2.3, -2.7, 7, 0.02], [-1.4, -3.2, 7.2, 0.04],
].map(s => { const b = bambooStalk(...s); island.add(b); return b; });

[[-2.6, 2.0, 0.6], [-2.3, 2.3, -0.4], [-2.85, 2.35, 1.3]].forEach(([x, z, r]) => {
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 1.3, 12), M.bamboo);
  stick.rotation.set(0, r, Math.PI / 2);
  stick.position.set(x, 0.09, z);
  stick.castShadow = true;
  island.add(stick);
});
const fl = new THREE.Group();
for (let i = 0; i < 14; i++) {
  const a = rnd() * Math.PI * 2, r = 2 + rnd() * 2.2;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (z > 2.6 && Math.abs(x) < 1.2) continue;
  const colors = [0xffffff, 0xffd84d, 0xff9fb0];
  const f = ball(new THREE.MeshStandardMaterial({ color: colors[i % 3], roughness: 0.6 }), 0.07);
  f.position.set(x, 0.06, z);
  fl.add(f);
}
island.add(fl);
[[2.2, 1.9, 0.25], [2.6, 1.5, 0.16], [-2.8, 0.9, 0.2]].forEach(([x, z, r]) => {
  const s = ball(M.stone, r, 1.3, 0.7, 1);
  s.position.set(x, r * 0.3, z);
  s.castShadow = true;
  island.add(s);
});

const falling = [];
if (!reduced) {
  for (let i = 0; i < 14; i++) {
    const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.45), M.leaf);
    leaf.userData = { x: (rnd() - 0.5) * 9, z: -1 - rnd() * 3, y: rnd() * 7, sp: 0.25 + rnd() * 0.3, ph: rnd() * 6 };
    scene.add(leaf);
    falling.push(leaf);
  }
}

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const dist = Math.max(12.5, 6.2 / (0.63 * camera.aspect));
  camera.position.set(0, 2.9 + dist * 0.06, dist);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const pointer = new THREE.Vector2(), look = new THREE.Vector2();
const ray = new THREE.Raycaster();
function setPointer(e) {
  const r = container.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function hitsPanda() {
  ray.setFromCamera(pointer, camera);
  return ray.intersectObject(panda, true).length > 0;
}
container.addEventListener("pointermove", e => {
  setPointer(e);
  container.style.cursor = hitsPanda() ? "pointer" : "default";
});
container.addEventListener("click", e => {
  setPointer(e);
  if (hitsPanda()) poke(e.clientX, e.clientY);
});
container.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    const p = screenPos(head, 0.2);
    poke(p.x, p.y);
  }
});

const lines = [
  ["Hallo! Schön, dass du da bist! 👋", "wave"],
  ["Hihi, das kitzelt!", "wiggle"],
  ["Hast du zufällig Bambus dabei? 🎋", "nod"],
  ["Schau mal, wie hoch ich springen kann!", "jump"],
  ["Zeit für ein Tänzchen! 💃", "dance"],
  ["Ich esse bis zu 14 Stunden am Tag. Ganz normal.", "nod"],
  ["Einmal im Kreis drehen!", "spin"],
  ["Pandas sind eigentlich Bären. Gefährlich, oder? 🐻", "wiggle"],
  ["Hopp, hopp!", "jump"],
  ["Ich hab dich gern! 💚", "wave"],
  ["Mir ist schwindelig … noch mal!", "spin"],
  ["Weißt du, was ich mag? Nickerchen. Und Bambus.", "nod"],
  ["Party auf meiner Insel! 🎉", "dance"],
];
const durations = { wave: 2.2, jump: 1.5, spin: 1.3, dance: 2.6, nod: 1.6, wiggle: 1.3 };
let action = null, last = -1, count = 0, typing, hideTimer, talkingUntil = 0;
const clock = new THREE.Clock();

function poke(x, y) {
  let n;
  do { n = Math.floor(Math.random() * lines.length); } while (n === last);
  last = n;
  const [text, move] = lines[n];
  action = { name: move, start: clock.getElapsedTime(), dur: durations[move] };
  say(text);
  hearts(x, y);
  count++;
  counter.textContent = count + " Mal gestreichelt";
}

function say(text) {
  clearInterval(typing);
  clearTimeout(hideTimer);
  bubble.textContent = "";
  bubble.classList.add("show");
  const chars = Array.from(text);
  let i = 0;
  talkingUntil = Infinity;
  typing = setInterval(() => {
    bubble.textContent += chars[i++];
    if (i >= chars.length) {
      clearInterval(typing);
      talkingUntil = clock.getElapsedTime() + 0.15;
      hideTimer = setTimeout(() => bubble.classList.remove("show"), 4500);
    }
  }, 40);
}

function hearts(x, y) {
  const icons = ["💚", "🎋", "✨", "💛"];
  for (let i = 0; i < 5; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = icons[i % icons.length];
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.setProperty("--dx", (Math.random() * 140 - 70) + "px");
    h.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");
    h.style.animationDelay = i * 60 + "ms";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1500);
  }
}

const tmp = new THREE.Vector3();
function screenPos(obj, yOffset) {
  obj.getWorldPosition(tmp);
  tmp.y += yOffset;
  tmp.project(camera);
  const r = container.getBoundingClientRect();
  return { x: (tmp.x * 0.5 + 0.5) * r.width + r.left, y: (-tmp.y * 0.5 + 0.5) * r.height + r.top };
}
function placeBubble() {
  const p = screenPos(head, 1.15);
  const w = bubble.offsetWidth;
  const half = w / 2;
  const x = Math.min(Math.max(p.x, half + 16), innerWidth - half - 16);
  bubble.style.left = x + "px";
  bubble.style.top = Math.max(p.y, bubble.offsetHeight + 90) + "px";
  bubble.style.setProperty("--tail", (50 + ((p.x - x) / w) * 100) + "%");
}

const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
let nextBlink = 2, frame = 0, lastT = 0, eat = 0;

const FULL = 1.6;
let stickLen = FULL;
const life = { mode: "sit", chewing: false, next: 3, biteAt: 0, bites: 0, pickStart: 0, waitUntil: 0 };
const PICK = new THREE.Vector3(-1.7, 0, 1.38);
const HOME = new THREE.Vector3(0, 0, 0);
const shoulderL = armL.position.clone();
const handLocal = new THREE.Vector3(0, -0.95, 0.22);
const handDir = handLocal.clone().normalize();
const armReach = handLocal.length();
const eatArmQ = new THREE.Quaternion();
const reachLow = new THREE.Vector3(-0.4, -0.7, 0.6).normalize();
const restUp = new THREE.Vector3(-0.2, 1, 0.25).normalize();
const UP = new THREE.Vector3(0, 1, 0);
const v5 = new THREE.Vector3(), v6 = new THREE.Vector3();
function mouthPos(out) {
  return out.copy(mouth.position).applyQuaternion(head.quaternion).add(head.position).add(v6.set(0, 0, 0.03).applyQuaternion(head.quaternion));
}
function computeEatQ() {
  const m = mouthPos(v2);
  const toMouth = v3.copy(m).sub(shoulderL).normalize();
  const need = Math.max(0.2, stickLen - GRIP);
  let lo = 0, hi = 1;
  for (let i = 0; i < 14; i++) {
    const s = (lo + hi) / 2;
    v5.copy(toMouth).multiplyScalar(1 - s).addScaledVector(reachLow, s).normalize();
    const d = v1.copy(shoulderL).addScaledVector(v5, armReach).distanceTo(m);
    if (d < need) lo = s; else hi = s;
  }
  v5.copy(toMouth).multiplyScalar(1 - lo).addScaledVector(reachLow, lo).normalize();
  eatArmQ.setFromUnitVectors(handDir, v5);
}
const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), v3 = new THREE.Vector3(), v4 = new THREE.Vector3();
const q1 = new THREE.Quaternion(), q2 = new THREE.Quaternion();
const crumbs = [];
const crumbGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
const yum = ["Mmmh, lecker! 😋", "Mampf, mampf …", "Knusper, knusper!", "Bester Bambus der Insel!"];

const angleDiff = (a, b) => {
  let d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
};
function turnTo(angle, dt) {
  const d = angleDiff(angle, panda.rotation.y);
  panda.rotation.y += Math.sign(d) * Math.min(Math.abs(d), dt * 4);
  return Math.abs(d) < 0.02;
}
function walkTo(target, dt) {
  const dx = target.x - panda.position.x, dz = target.z - panda.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.04) return true;
  const aligned = Math.abs(angleDiff(Math.atan2(dx, dz), panda.rotation.y)) < 0.4;
  turnTo(Math.atan2(dx, dz), dt);
  if (aligned) {
    const step = Math.min(dist, dt * 1.3);
    panda.position.x += dx / dist * step;
    panda.position.z += dz / dist * step;
  }
  return false;
}

function spawnCrumbs() {
  mouth.getWorldPosition(v4);
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(crumbGeo, i % 2 ? M.bamboo : M.leaf);
    m.position.copy(v4);
    scene.add(m);
    crumbs.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 1.4, 0.6 + Math.random() * 1.2, 0.3 + Math.random() * 0.8), life: 1.4 });
  }
}

function bite(t) {
  stickLen -= 0.09;
  if (stickLen < 0.5) stickLen = 0;
  spawnCrumbs();
  if (life.bites === 0 && stickLen > 0 && !bubble.classList.contains("show") && Math.random() < 0.4) {
    say(yum[Math.floor(Math.random() * yum.length)]);
  }
}

function updateLife(t, dt) {
  if (life.mode === "sit") {
    if (action && life.chewing) { life.chewing = false; life.next = t + 2; }
    if (!life.chewing && !action && t > life.next && stickLen > 0) {
      life.chewing = true; life.biteAt = t + 0.7; life.bites = 0;
    }
    if (life.chewing && t > life.biteAt && eat > 0.85) {
      bite(t);
      life.bites++;
      life.biteAt = t + 0.6;
      if (stickLen === 0) {
        life.chewing = false;
        life.mode = "done";
        life.waitUntil = t + 1.2;
      } else if (life.bites >= 3) {
        life.chewing = false;
        life.next = t + 2.5 + Math.random() * 2.5;
      }
    }
  } else if (life.mode === "done") {
    if (t > life.waitUntil) {
      say("Aufgegessen! Ich hol mir neuen Bambus. 🎋");
      life.mode = "go";
    }
  } else if (life.mode === "go") {
    if (walkTo(PICK, dt)) {
      const want = Math.atan2(-2.6 - PICK.x, 2.15 - PICK.z);
      if (turnTo(want, dt)) { life.mode = "pick"; life.pickStart = t; }
    }
  } else if (life.mode === "pick") {
    if (t - life.pickStart > 0.65 && stickLen === 0) stickLen = FULL;
    if (t - life.pickStart > 1.4) life.mode = "back";
  } else if (life.mode === "back") {
    if (walkTo(HOME, dt) && turnTo(0, dt)) {
      panda.position.set(0, 0, 0);
      life.mode = "sit";
      life.next = t + 1.5;
      say("Frischer Bambus! Mmmh. 😋");
    }
  }
}

function placeStick() {
  held.visible = stickLen > 0;
  if (!held.visible) return;
  const top = stickLen - GRIP;
  stalk.scale.y = stickLen;
  stickRings.forEach(({ r, d }) => {
    r.visible = d < stickLen - 0.06;
    r.position.y = -GRIP + d;
  });
  const leafLeft = Math.min(1, Math.max(0, (stickLen - (FULL - 0.27)) / 0.27));
  tuft.visible = leafLeft > 0.02;
  tuft.scale.setScalar(Math.max(0.02, leafLeft));
  tuft.position.y = top;
  stickCut.visible = !tuft.visible || leafLeft < 0.95;
  stickCut.position.y = top + 0.002;
  const hand = v1.copy(handLocal).applyQuaternion(armL.quaternion).add(armL.position);
  const eatDir = mouthPos(v2).sub(hand).normalize();
  const dir = v3.copy(restUp).multiplyScalar(1 - eat).addScaledVector(eatDir, eat).normalize();
  q1.setFromUnitVectors(UP, dir);
  q2.copy(armL.quaternion).invert();
  held.quaternion.copy(q2).multiply(q1);
  held.position.copy(handLocal);
}

function readTheme() {
  const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sun")) || 1.15;
  sun.intensity = k;
  hemi.intensity = 0.5 + k * 0.35;
  renderer.toneMappingExposure = k < 1 ? 0.85 : 1;
}
readTheme();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (++frame % 60 === 0) readTheme();

  const dt = Math.min(0.05, t - lastT);
  lastT = t;
  updateLife(t, dt);
  eat += ((life.chewing && !action ? 1 : 0) - eat) * Math.min(1, dt * 5);

  root.position.set(0, 0, 0);
  root.rotation.set(0, 0, 0);
  root.scale.set(1, 1, 1);
  legL.rotation.x = 0;
  legR.rotation.x = 0;
  torso.scale.set(1, 1 + 0.015 * Math.sin(t * 2), 1);
  armR.rotation.set(-0.5, 0, 0.25 + 0.03 * Math.sin(t * 2));
  armL.rotation.set(-0.5, 0, -0.25 - 0.03 * Math.sin(t * 2));
  look.lerp(pointer, 0.06);
  const lk = 1 - eat;
  head.rotation.set(
    -look.y * 0.3 * lk + 0.1 * eat + 0.04 * Math.sin(t * 1.3) + 0.05 * Math.sin(t * 13) * eat,
    look.x * 0.55 * lk - 0.15 * eat,
    0.04 * Math.sin(t * 0.9) + 0.08 * eat
  );
  head.position.y = 2.47 + 0.02 * Math.sin(t * 2);
  if (eat > 0.001) { computeEatQ(); armL.quaternion.slerp(eatArmQ, eat); }

  if (action) {
    const p = (t - action.start) / action.dur;
    if (p >= 1) action = null;
    else {
      const e = Math.min(1, Math.sin(Math.PI * p) * 2.5);
      switch (action.name) {
        case "wave":
          armR.rotation.z = THREE.MathUtils.lerp(0.25, 2.5 + 0.35 * Math.sin(t * 12), e);
          armR.rotation.x = THREE.MathUtils.lerp(-0.5, 0, e);
          head.rotation.z += 0.15 * e;
          break;
        case "jump": {
          const q = (p * 2) % 1, h = Math.sin(Math.PI * q);
          root.position.y = 1.3 * h;
          root.scale.set(1 + 0.08 * (1 - h) * e, 1 - 0.08 * (1 - h) * e + 0.05 * h, 1);
          armR.rotation.z += 1.6 * h;
          armL.rotation.z -= 1.6 * h;
          break;
        }
        case "spin":
          root.rotation.y = ease(p) * Math.PI * 2;
          root.position.y = 0.4 * Math.sin(Math.PI * p);
          break;
        case "dance":
          root.rotation.z = 0.14 * Math.sin(t * 8) * e;
          root.position.x = 0.35 * Math.sin(t * 4) * e;
          root.position.y = Math.abs(Math.sin(t * 8)) * 0.15 * e;
          armR.rotation.z = 0.25 + (1.6 + 0.6 * Math.sin(t * 8)) * e;
          armL.rotation.z = -(0.25 + (1.6 + 0.6 * Math.sin(t * 8 + Math.PI)) * e);
          head.rotation.z += 0.18 * Math.sin(t * 8 + 1) * e;
          break;
        case "nod":
          head.rotation.x += 0.22 * (0.5 + 0.5 * Math.sin(t * 11)) * e;
          armR.rotation.x -= 0.5 * e;
          armL.rotation.x -= 0.5 * e;
          break;
        case "wiggle":
          root.rotation.z = 0.07 * Math.sin(t * 32) * e;
          root.rotation.y = 0.12 * Math.sin(t * 16) * e;
          armR.rotation.x -= 0.6 * e;
          armL.rotation.x -= 0.6 * e;
          armR.rotation.z -= 0.35 * e;
          armL.rotation.z += 0.35 * e;
          break;
      }
    }
  }

  if (!action && (life.mode === "go" || life.mode === "back")) {
    const w = t * 9;
    root.position.y = Math.abs(Math.sin(w)) * 0.12;
    root.rotation.z = Math.sin(w) * 0.08;
    legL.rotation.x = Math.sin(w) * 0.35;
    legR.rotation.x = -Math.sin(w) * 0.35;
    armR.rotation.x += Math.sin(w) * 0.3;
    armL.rotation.x -= Math.sin(w) * 0.3;
  } else if (!action && life.mode === "pick") {
    const b = Math.sin(Math.PI * Math.min(1, (t - life.pickStart) / 1.4));
    root.rotation.x = 0.45 * b;
    armL.rotation.x -= 1.0 * b;
    armR.rotation.x -= 1.0 * b;
  }

  const talking = t < talkingUntil;
  const chew = 0.02 + 0.045 * (0.5 + 0.5 * Math.sin(t * 13));
  const target = talking ? 0.03 + 0.045 * (0.5 + 0.5 * Math.sin(t * 28)) : 0.018 + (chew - 0.018) * eat;
  mouth.scale.y += (target - mouth.scale.y) * 0.35;

  placeStick();
  for (let i = crumbs.length - 1; i >= 0; i--) {
    const c = crumbs[i];
    c.v.y -= 9.8 * dt;
    c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += dt * 8;
    if (c.m.position.y < 0.03) { c.m.position.y = 0.03; c.v.set(0, 0, 0); }
    c.life -= dt;
    if (c.life < 0) { scene.remove(c.m); crumbs.splice(i, 1); }
  }

  if (t > nextBlink) {
    const b = (t - nextBlink) / 0.15;
    const s = b < 1 ? 1 - Math.sin(Math.PI * b) * 0.9 : 1;
    eyes.forEach(e => e.scale.y = s);
    if (b >= 1) nextBlink = t + 2 + Math.random() * 3;
  }

  stalks.forEach((s, i) => { s.rotation.x = -0.02 + 0.015 * Math.sin(t * 0.8 + i); });
  falling.forEach(l => {
    const d = l.userData;
    d.y -= d.sp * 0.016;
    if (d.y < 0) d.y = 7;
    l.position.set(d.x + Math.sin(t + d.ph) * 0.5, d.y, d.z);
    l.rotation.set(t + d.ph, t * 0.7, Math.sin(t * 2 + d.ph));
  });

  if (!reduced) {
    camera.position.x = look.x * 0.6;
    camera.lookAt(lookTarget);
  } else camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  if (bubble.classList.contains("show")) placeBubble();
}
animate();
setTimeout(() => say("Hallo! Ich bin Hans. Klick mich an! 🎋"), 600);
</script>
